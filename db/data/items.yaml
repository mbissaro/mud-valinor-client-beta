# Itens. id: item:<slug>. description = texto/flavor do item; category/effects = mecanica.
- id: item:maca
  name: "uma deliciosa maçã"
  category: food
  description: >
    Colhida do galho mais baixo de uma macieira ("Diversas maçãs podem
    ser vistas em seus galhos, algumas verdes e outras prontas para
    consumo imediato"). Sintaxe exata: `get maçã macieira` (não "colher
    maçã"); comer com `eat maçã` só funciona depois de descartar o
    caroço de maçã do inventário, senão o parser prioriza o caroço.
  effects: {cures: hunger-any-stage}
  obtain: [{method: harvest, from: "loc:bri.avenida-zenite / loc:valfenda.alameda-juniperos / loc:valfenda.circulo-florido", cost: 0}]
  quirks: ["ambígua com 'caroço de maçã' no parser de eat"]
  tags: [comida, gratis, ilimitado]
  sources: ["notas.md#DESCOBERTA ENORME: macieira grátis na Avenida Zênite resolve fome pra sempre", "notas.md#Sintaxe exata pra colher/comer maçã da macieira (resolvido de vez)"]
  confidence: confirmed

