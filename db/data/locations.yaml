- id: loc:bri.praca
  name: A Praça de Bri
  region: region:bri
  kind: room
  safe_zone: true
  status: explored
  description: >
    "Você está na extensa e famosa área da Praça de Bri. Uma magnífica
    fonte de mármore ocupa o centro da praça, rodeada por um verdejante
    jardim de arbustos que realça o ar de serenidade e paz, mesmo estando
    no centro da vila. As estradas se estendem nas quatro direções
    enquanto que para nordeste e noroeste observam-se caminhos
    arborizados. Na esquina, há um poste de madeira... Em frente à fonte
    há dois bancos de pedra."
