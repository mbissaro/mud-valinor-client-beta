# Lugares notaveis (nao sala-a-sala). id: loc:<regiao>.<nome>.
# description = texto/paráfrase da descrição real do jogo (flavor); summary = leitura funcional curta.
- id: loc:academia.saguao
  name: O Saguão (Academia de Aventureiros)
  region: region:academia
  kind: room
  safe_zone: true
  status: explored
  description: >
    "Você está no saguão de entrada da Academia de Aventureiros, um lugar
    onde os jovens aventureiros têm tudo que precisam... Há um quadro na
    parede norte com uma planta da academia. Uma grande arcada a oeste
    leva ao depósito de armaduras. Ao leste, uma arcada leva ao depósito
    de armas. Outra arcada, a norte, leva ao corredor principal da
    academia. Duas escadas ocupam a parte sul, uma leva ao segundo andar
    e a outra para a saída." Fonte de mármore no centro; diretora presente.
  summary: "Saguão de entrada; ponto de retorno universal; porta de saída é 'return-to-entry' por cidade."
  sources: ["notas.md#Academia de Aventureiros (zona segura)"]
  confidence: confirmed

- id: loc:academia.centro-jardim
  name: Centro do Jardim
  region: region:academia
  kind: room
  safe_zone: true
  status: explored
  description: >
    Pátio aberto ao norte do corredor principal, com portão (!n) pro Amplo
    Bosque. Narinë, a compradora universal, fica sempre aqui recebendo
    itens de jogadores.
  summary: "Narinë fica aqui, compra qualquer item por 1 gold; porta !n pro Amplo Bosque."
  sources: ["notas.md#Mapa da Academia (térreo, eixo norte-sul)"]
  confidence: confirmed

- id: loc:academia.sala-cura
  name: Sala de Cura (Academia)
  region: region:academia
  kind: room
  safe_zone: true
  status: explored
  description: >
    "A sala é ampla e bem iluminada, e você pode ver várias pessoas aqui.
    Nesta sala fica o curandeiro da academia... Uma janela ocupa boa
    parte da parede norte e através dela é possível avistar o jardim...
    A fonte de mármore goteja água cristalina. Vários leitos estão
    organizados em fileiras." Mestre Toric brilha sob uma aura branca.
  features: [{type: heal-bed, command: "sleep leitos"}]
  summary: "Mestre Toric cura dormindo nos leitos, dá bênçãos."
  sources: ["notas.md#Básico"]
  confidence: confirmed

