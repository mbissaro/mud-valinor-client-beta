- id: obj:cenario.misterioso-orbe-atrai-a-sua-atencao
  name: Um misterioso orbe atrai a sua atenção.
  kind: scenery
  flags: (Brilhando)
  descriptions:
  - text: |-
      Ao observar este orbe, o seguinte conhecimento lhe é transmitido:
                                  PREPARAÇÃO
      É importante que você entenda o seu personagem nos mínimos detalhes. A
      começar pelas escolhas que fez para ele, pois as mesmas são decisivas para
      as necessidades que ele terá ao longo do jogo. E só entendendo todas as
      possibilidades para seu personagem, que você poderá prepará-lo melhor para
      enfrentar o mundo.
      Por exemplo, se escolheu uma das classes físicas para ele (Guerreiro,
      Ladino ou Ranger), ele precisará ter atributos físicos mais altos
      (Constituição, Destreza e Força).
      Já se escolheu uma das classes mágicas para ele (Clérigo, Druida e Mago),
      ele precisará ter atributos mentais mais altos (Inteligência e Sabedoria).
      Assim como saber quais atributos dão mais benefícios para a classe que
      escolheu, você também deve saber quais os tipos de objetos são mais
      favoráveis para o seu personagem. Por exemplo, Guerreiros e Rangers
      favorecem armaduras pesadas e feitas de metal. Já Clérigos, Druidas e
      Magos não usam armaduras pesadas, evitam armaduras metálicas e acabam
      usando somente armaduras leves e orgânicas, como de couro e madeira.
      Além dos tipos de armaduras diferentes, cada uma das classes costuma ter
      um tipo de arma que melhor se adeque a mesma. Você saberá mais sobre isso
      quando seu personagem estiver perto de entrar em combate.
      Outro ponto importante de se ter em conta, é o alinhamento que escolherá
      manter para o seu personagem, pois tem itens que só podem ser usados por
      personagens bons, outros itens que só por personagens neutros e outros que
      só por personagens maus.
      Não deixe de ler os tópicos de ajuda da raça e da classe que escolheu para
      o seu personagem para descobrir as melhores opções para ele durante o
      jogo. Para isso digite HELP NOME_DA_CLASSE ou HELP NOME_DA_RAÇA.
      Para continuar seus estudos, chame o professor falando no SAY PROFESSOR.
      O professor Dogrod faz algumas anotações.
    rooms:
    - room:academia.a-sala-da-preparacao
  - text: |-
      Ao examinar este orbe, o seguinte conhecimento lhe é transmitido:
                                    OBSERVAÇÃO
      A ação mais simples que você poderá executar no MUD será o ato de observar, e
      como tudo o que será encontrado aqui estará em forma de texto, olhar e saber
      interpretar as informações mostradas na tela é a chave para o bom entendimento
      do jogo e de seus mais variados desafios propostos.
      Quando você entra em uma sala a primeira coisa que aparecerá será o título
      dela seguido de um texto contendo a descrição da mesma. Logo abaixo são
      mostradas as saídas óbvias da sala (você logo aprenderá sobre elas) e
      finalmente haverá uma listagem com os objetos e personagens que estão no
      local.
      O comando para olhar é LOOK <palavra>, sendo que <palavra> deve ser trocado
      pelo objeto ou pessoa que esteja na sala e que você deseje ver. Digitando
      apenas LOOK, você olha para a sala tal como ela é notada assim que entra
      nela.
      Além do LOOK, você pode usar também os comandos EXAMINE e o GLANCE.
      Você perceberá que o EXAMINE é mais utilizado para observar itens e o
      glance mais para fazer observações rápidas dos lugares e criaturas.
      OBS: Assim como o LOOK, o EXAMINE e o GLANCE também aceitam argumentos,
      experimente
      "GLANCE PROFESSOR".
      Para mais informações sobre cada um deles, você pode consultar os
      respectivos tópicos de ajuda, basta digitar: HELP EXAMINE, HELP GLANCE e
      HELP LOOK.
      Ao longo do jogo, tente observar os elementos importantes contidos nas
      descrições das salas, tal como as janelas contidas na descrição desta.
      Após ter feito isso, digite N para continuar sem falar com o professor. Ou
      digite "GLANCE PROFESSOR" sem as aspas para chamar a atenção dele e
      descobrir o que ele pode lhe ensinar.
      O professor Servan faz algumas anotações.
    rooms:
    - room:academia.a-sala-da-observacao
  - text: |-
      Ao observar este orbe, o seguinte conhecimento lhe é transmitido:
                                 MOVIMENTAÇÃO
      Geralmente, toda a movimentação no MUD é feita com base nos pontos
      cardeais: norte (N), nordeste (NE), leste (E), sudeste (SE), sul (S)
      sudoeste (SW) oeste (W) e noroeste (NW), além de também ser possível ir
      para cima (U) e para baixo (D).
      Ao entrar em uma sala, ou usar os comandos LOOK e GLANCE, é possível ver
      abaixo da descrição ou do nome quais as saídas possíveis para a sala em
      que você está, e teclando EXITS você poderá ter uma informação mais
      detalhada das saídas, mostrando quais são elas e para quais salas elas
      poderão te levar. Para andar até outra sala qualquer, basta digitar uma
      das saídas indicadas na descrição da sala (E para ir para o leste, W para
      ir para o oeste e etc.).
      Existem outras maneiras de se mover pelo jogo, mas você só as verá mais
      adiante. Assim como existem caminhos que estarão escondidos ou bloqueados
      por portas fechadas ou portões trancados...
      Outro ponto importante é que, ao caminhar por aí, você gradualmente
      perderá pontos de movimento (abreviado por mv), indicando o cansaço do seu
      personagem.
      Quando seus pontos se esgotam, você fica impossibilitado de caminhar e
      deverá sentar (SIT), descansar (REST) ou dormir (SLEEP) até se recuperar.
      Para acordar usa-se o comando WAKE e para se levantar, digita-se STAND.
      Para mais informações, consulte o tópico de ajuda digitando HELP
      MOVIMENTO.
      Para continuar sem interagir com o professor, basta ir para o leste
      digitando E. Mas caso queira interagir com ele e descobrir o que mais ele
      pode lhe ensinar, digite GLANCE PROFESSOR.
      O professor Pildo faz algumas anotações.
    rooms:
    - room:academia.a-sala-da-movimentacao
  - text: |-
      Ao observar este orbe, o seguinte conhecimento lhe é transmitido:
                                     COMBATE
      Lutas são uma atividade muito comum no MUD, pois é por meio delas que os
      personagens adquirem pontos de experiência, além dos itens que o ponente
      estiver carregando.
      Antes de começar um combate, você deverá estimar se o seu adversário é páreo;
      para isso, use o comando CONSIDER <adversário>.
      Caso o adversário pareça páreo, você poderá iniciar um ataque com o comando
      KILL <adversário>. Após iniciada a luta, cada golpe acertado pelo adversário
      inflingirá dano ao seu personagem, fazendo com que perca uma parcela
      proporcional dos seus pontos de vida (ocorrerá o mesmo com o seu adversário
      para cada acerto seu). Você poderá saber a condição atual do seu oponente
      olhando para ele durante o combate, ou de forma mais abreviada, digitando
      GLANCE <adversário>.
      Ao vencer uma luta, você receberá uma quantia de experiência proporcional ao
      nível do adversário, sua dificuldade e alguns outros fatores.
      Caso os seus pontos de vida fiquem abaixo de 1, você ficará inconsciente,
      podendo às vezes se recuperar naturalmente com o tempo. Caso isto não ocorra,
      você morrerá e irá para os Salões de Espera, onde terá que aguardar até que
      você retorne com um novo corpo para a Terra-Média. Todos os seus itens
      ficarão no corpo antigo e você terá de recuperá-los dele quando
      encontrá-lo após sair dos Salões de Espera..
      Digite EXAMINE PLACA para continuar a leitura.
      A professora Bhieda faz algumas anotações.
    rooms:
    - room:academia.a-sala-do-combate
  - text: |-
      Ao observar este orbe, o seguinte conhecimento lhe é transmitido:
                                  CONTÊINERS
      Contêiners são objetos especiais que possuem a capacidade de armazenar
      outros objetos em seu interior. Podem ser fixos na sala, (não podendo ser
      carregados juntos com você) tais como armários, estantes ou aquele grande baú
      repleto de tesouros que você talvez um dia desenterre, ou podem ser
      portáteis, onde mochilas, bolsas, caixinhas e tudo aquilo que possa carregar
      nas suas mãos com facilidade se enquadram.
      O conteúdo de um contêiner pode ser observado digitando EXAMINE <contêiner>
      (este comando também poderá lhe dar informações úteis para demais tipos de
      objetos).
      Para pegar um objeto que esteja dentro de um contêiner, digite GET <objeto>
      <contêiner> (por exemplo: GET anel baú) e para colocar um objeto dentro
      de um contêiner, digite PUT <objeto> <contêiner> (por exemplo: PUT cantil
      bolsa)
      Assim como as saídas, contêiners podem muitas vezes estar fechados ou até
      mesmo trancados, e para estes casos, use os comandos OPEN <contêiner>, ou
      então UNLOCK <contêiner> (estando de posse da chave do contêiner trancado)
      respectivamente. Para fechar um contêiner, digite CLOSE <contêiner> e para
      trancá-lo, desde que possua a sua chave, digite LOCK <contêiner>.
      Nesta sala há um armário com um objeto em seu interior. Experimente abrir
      o armário, pegar o objeto que está dentro e entregá-lo ao professor que está
      perto de você.
      O professor Mithrael faz algumas anotações.
    rooms:
    - room:academia.a-sala-dos-conteiners
  - text: |-
      Ao observar este orbe, o seguinte conhecimento lhe é transmitido:
                                  HABILIDADES
      As habilidades podem ser perícias ou magias. Cada classe tem um grande
      número delas. Elas permitem que seu personagem lute de maneira mais
      eficiente do que apenas com armas, além de ajudar o mesmo no dia-a-dia de
      muitas outras maneiras.
      Seu personagem pode usar magias de invisibiliddade e de voar para explorar
      lugares desconhecidos; perícias para arrombar portas ou desfazer
      armadilhas para entrar em lugares perigosos; dentre tantas outras
      possibilidades físicas e mágicas.
      Para ver as habilidades recomendadas para o seu personagem aprender no
      nível atual, digite PRACTICE. Você verá também a proficiência nas que ele
      já aprendeu. Para ver uma lista de todas as habilidades da classe atual,
      digite SLIST.
      Não deixe de ler o HELP PRACTICE e o HELP SLIST.
      Para aprender uma habilidade, seu personagem precisará ter os pontos de
      prática, as moedas de ouro e quaisquer outros requisitos mínimos
      necessários que cada habilidade exige. Para saber mais informações sobre
      uma habilidade específica, digite PRACTICE INFO "NOME_DA_HABILIDADE" ou
      PRAC INFO "NOME_DA_HABILIDADE". Com isso, será exibido as informações de
      como usar a habilidade, o que é preciso para aprendê-la e quais mestres a
      ensinam.
      Para continuar seu aprendizado, examine a placa fixada na parede. Para
      isso digite EXAMINE PLACA.
      O professor Rodhvan faz algumas anotações.
    rooms:
    - room:academia.a-sala-das-habilidades
  - text: |-
      Ao observar este orbe, o seguinte conhecimento lhe é transmitido:
                                    COMUNICAÇÃO
      Saber se comunicar no MUD é fundamental, pois é a principal forma com que você
      interage com outros personagens, interpreta, e compartilha informações.
      É possível se comunicar de duas formas distintas, a saber, por meio de canais
      IC (In Character) e canais OOC (Out of Character). Canais IC são aqueles
      que você deve utilizar quando está interpretando o seu personagem, tal como se
      você estivesse na Terra-Média. Já os canais OOC são utilizados para uma
      comunicação mais geral, com assuntos que podem ir além do personagem e do mundo
      fantasioso a sua volta.
      Quando um jogador comenta com outra pessoa que esteja na mesma sala que ele
      as suas aventuras, a criatura que ele matou, tesouros que ele conquistou ou
      até mesmo uma informação de como chegar em uma cidade do jogo, este jogador
      deverá utilizar meios de comunicação (canais) IC.
      Já quando você quer comentar sobre alguma notícia que viu na internet, ou
      passar alguma informação que não tenha relação com o MUD, deverá utilizar
      os canais OOC.
      OBS: OOC é o mesmo que IRL, termo também usado em jogos com o mesmo
      significado.
      Tecle EXAMINE PLACA para continuar seu aprendizado.
      A professora Erisha faz algumas anotações.
    rooms:
    - room:academia.a-sala-da-comunicacao
  - text: |-
      Ao observar este orbe, o seguinte conhecimento lhe é transmitido:
                                   PORTAS
      Pode ocorrer que algumas vezes você se depare com uma saída por onde não
      consiga passar livremente, pois há uma porta fechada naquela direção.
      Quando uma saída está fechada ou trancada, ela será indicada com um ponto
      de exclamação do lado da saída (por exemplo: Saídas: e u !n - a saída para
      o norte se encontra fechada e/ou trancada).
      Para abrir uma porta fechada, digite OPEN <nome da saída ou direção> (no
      exemplo anterior, para abrir a porta você digitaria OPEN N), se a porta
      estiver trancada, você precisará da chave que a destranque. De posse da
      chave, o comando para destrancar será UNLOCK <nome da saída ou direção> e após
      isso ainda deve-se abrir a porta com OPEN <nome da saída ou direção>.
      Também é possível fechar uma porta aberta digitando CLOSE <nome da saída ou
      direção> e até mesmo trancá-la, desde que possua a chave; para isso, digita-se
      LOCK <nome da saída ou direção>.
      Vale lembrar que, saídas enterradas, ocultas e secretas também podem estar
      trancadas.
      OBS: Em objetos que possuam portas e tampas também usa-se os comandos
      OPEN, UNLOCK, CLOSE e LOCK para manipulá-los.
      Para seguir adiante, você terá que abrir uma das portas desta sala.
    rooms:
    - room:academia.a-sala-das-portas
  - text: |-
      Ao observar este orbe, o seguinte conhecimento lhe é transmitido:
                                AJUDA
      Até agora você conheceu alguns comandos úteis do MUD e ao longo do
      tutorial conhecerá outros tantos. De início eles parecerão muitos e será
      comum você se esquecer de algum em momentos que possa precisar.
      Mas, não se preocupe, tudo o que aprendeu poderá ser revisto com muito
      mais detalhes usando o comando HELP. Ao digitar HELP aparecerá para você
      um menu com vários tópicos úteis. Digitando HLIST será exibido uma imensa
      lista com todos os tópicos de ajuda.
      Caso você queira saber mais sobre algum comando em especial, magia,
      perícia, localidade ou termo encontrado no seu SCORE, poderá fazê-lo
      digitando HELP <palavra>.
      Todo iniciante que entra no MUD Valinor também recebe O Guia do
      Aventureiro que contém os principais tópicos abordados até aqui. Para
      lê-lo, digite LOOK GUIA.
      Para muitas outras informações, acesse o site: http://mud.valinor.com.br/
      Caso queira interagir com a professora, dê aquela olhada rápida nela. Ou
      se quiser somente prosseguir, vá para o leste.
      A professora Duelda faz algumas anotações.
    rooms:
    - room:academia.a-sala-da-ajuda
  - text: |-
      Ao observar este orbe, o seguinte conhecimento lhe é transmitido:
                                    OBJETOS
      Objetos estão em todos os lugares e desempenham as mais diversas funções:
      eles são as roupas que você veste, a espada lendária que um dia talvez você
      encontre, camas, cadeiras, chaves e até mesmo a comida que você ingere e a
      água que você bebe.
      Sim, são muitos os tipos de objetos assim como são muitas as formas com que
      você os manipula, mas por hora, você será apresentado a alguns comandos mais
      básicos.
      Para pegar um objeto que esteja no chão, você digita GET <objeto>, para
      largar um objeto que esteja com você, digite DROP <objeto> e caso queira
      dar um objeto que esteja com você para outra pessoa, o comando é GIVE
      <objeto> <pessoa>.
      Para que você veja os objetos que você veste no seu corpo, digite
      EQUIPMENT ou EQ. Uma nova peça de roupa ou armadura poderá ser vestida com
      o comando WEAR <nome da peça>. Digitando INVENTORY (abreviado por INV)
      você poderá ver os itens que você está carregando.
      Digite EXAMINE PLACA para continuar seu aprendizado.
      O professor Elundhir faz algumas anotações.
    rooms:
    - room:academia.a-sala-dos-objetos
  - text: |-
      Ao observar este orbe, o seguinte conhecimento lhe é transmitido:
                                   ATENÇÃO
      Algumas vezes existirão passagens escondidas onde a saída não irá
      aparecer para você. Geralmente estas saídas o levarão para atalhos,
      locais com tesouros ou até mesmo será o único meio de você sair
      de alguma sala (caso de algumas armadilhas).
      A melhor estratégia para descobrir saídas escondidas é ler atentamente
      as descrições das salas, procurando observar os elementos que compõem
      o cenário de modo a encontrar uma passagem.
      Nesta sala há uma passagem escondida; para que você consiga encontrá-la
      siga as dicas acima, lendo cuidadosamente a descrição da sala e
      observando os elementos do cenário. Caso seja bem sucedido, poderá
      continuar seus estudos.
