    a aspereza do Mundo, desejavam construir a beleza perfeita que tinham
    visto na Visão. Mas houve disputa entre os Valar e a guerra estragou seus
    trabalhos. Mas ao menos o primeiro reino dos Valar, chamado, Almaren,
    foi feito em uma ilha no meio de um vasto lago na Terra-média, e todo o
    Mundo foi iluminado pelas duas Lâmpadas brilhantes que estavam no Norte
    e Sul. Então começou a Era das Lâmpadas. Mas um dos Valar se revoltou
    e quebrou as Grandes Lâmpadas dos Valar e destruiu a Ilha de Almaren e
    seus jardins encantados.
  - |-
    Os Poderes de Arda - Página 3
