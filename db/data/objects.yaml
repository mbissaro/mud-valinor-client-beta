      ela é feita de uma pequena armação de madeira, que ampara um cano de ferro
      escuro. Ele desce direto até as águas calmas do lago lá embaixo. Uma dura
      alavanca precisa ser empurrada para baixo para que a água venha através do
      cano e caia no balde de chumbo colocado sob ele. Uma pequena placa na bomba
      traz um recado muito útil da prefeitura:
      Caros Moradores e Viajantes: Usem as bombas com civilidade!
      Empurre a alavanca para que a água caia no balde.
      Obs: Não tentem levar os baldes da prefeitura consigo!
