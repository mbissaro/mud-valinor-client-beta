- id: obj:cenario.ao-lado-da-janela-jaz-uma-grande-placa
  name: Ao lado da janela, jaz uma grande placa.
  kind: scenery
  descriptions:
  - text: |-
      As palavras contidas nesta placa lhe revelam o seguinte conhecimento:
                               Fome, Sede e Móveis
      Com o passar do tempo, o seu personagem passará a sentir fome e sede, e
      caso você não o sacie, logo ele começará a perder pontos de vida (hp)
      gradualmente até que acabe por morrer. Para que você possa alimentar seu
      personagem, terá que ter comida no inventário e digitar EAT <nome da
      comida desejada>.
      Para que você possa dar água para seu personagem, deverá ter no seu
      inventário algum recipiente com água, tal como um cantil, garrafa e etc.,
      e digitar DRINK <nome do recipiente> algumas vezes até que o seu
      personagem fique completamente saciado.
      Em certas salas você encontrará fontes que servirão tanto para beber
      quanto para reabastecimento. Para beber de uma fonte, o comando é DRINK
      <fonte>, e para reabastecer um recipiente, digita-se FILL <recipiente>.
      No momento não há necessidade para se preocupar, pois enquanto estiver
      aprendendo os comandos básicos, não sentirá nem fome nem sede. até
      terminar o seu treinamento, você também receberá um cantil e um pouco de
      comida, além de informações de como se obter mais alimento.
      Alguns objetos são móveis que servem para descanso também. Inclusive, seu
      personagem poderá se sentar sobre a cadeira que está na sala digitando SIT
      CADEIRA.
      Para se levantar, use o comando STAND.
      Para interagir com o professor, basta dar aquela olhada rápida nele.
      O professor Elundhir faz algumas anotações.
