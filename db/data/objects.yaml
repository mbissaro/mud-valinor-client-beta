      Digitando REPORT, será mostrado para quem estiver na mesma sala o status de
      vida, mana, movimento , etc. do seu personagem.
      Digitando WHOIS NOME, mostrará algumas informações básicas do personagem desejado,
      inclusive do seu próprio personagem.
      Antes de continuar, leve um tempo e teste esses comandos novos.
      Caso precise, leia o help de cada um deles, digitando HELP COMANDO.
      Para chamar a atenção da professora desta sala, você deve relatar o status
      atual do seu personagem digitando REPORT.
      A professora Idhissiel faz algumas anotações.
