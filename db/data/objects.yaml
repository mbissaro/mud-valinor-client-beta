  - text: |-
      Mapa da Academia de Aventureiros
          O mapa representa a planta-baixa da Academia de Aventureiros, onde se
      destaca um corredor central que percorre o sentido norte-sul e dá acesso a
      salas a leste a oeste.
          Na extremidade sul deste corredor, fica o saguão de entrada com a loja
      ao leste e a entrada para as salas de treinamento ao oeste.
          O corredor inicia-se ao norte do saguão de entrada e da acesso ao
      refeitório ao leste e à sala de estudos ao oeste.
          O corredor continua ao norte, onde dá acesso a sala de estudos de
      idiomas ao leste e a sala de treinamento de perícias ao oeste; a oeste
      desta última sala, fica a sala de treinamento de magias.
          O corredor continua ao norte, onde dá acesso ao depósito de armas
      ao leste e ao depósito de armaduras ao oeste.
          Ao norte desse último segmento fica a sala de curta. Ao norte,
      leste e oeste da sala de cura ficam três diferentes salas de combate.
