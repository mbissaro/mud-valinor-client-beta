- id: obj:cenario.porta
  name: porta
  kind: scenery
  descriptions:
  - text: |-
      Para a Estrada Leste.Você tenta ver adiante...
      A Grande Estrada Leste
      Você caminha pela parte sul da Grande Estrada Leste. Para o oeste, por
      trás de uma cerca baixa de madeira, pode-se ver uma casa simples de pedra,
      com um só andar e telhado de palha, usada pelos habitantes como depósito
      de generalidades. Ao leste, por baixo de um grande arco do qual pende uma
      placa de madeira, fica o pátio da famosa estalagem: o Pônei Saltitante. Dos
      dois pavilhões que formam a estalagem saem sonoras e animadas gargalhadas.
      A estrada pavimentada estende-se para norte e sul, onde pode-se ver uma
      interseção.
      Saídas: n e s w
      Há um cesto para lixo aqui.
      Um guarda está patrulhando aqui.
    rooms:
    - room:bri.a-grande-estrada-leste
  - text: |-
      Pequenas engrenagens e molas distribuem-se dentro deste objeto. Um silvo ou
      zunido flui adiante como ondas sem um oceano. À medida que você examina por
      dentro, seus dedos tateiam algo. Embora você não pareça ter descoberto nada.
      Uma busca um pouco mais minuciosa parece ser necessária se você quiser
      desvendar esta misteriosa caixa.
