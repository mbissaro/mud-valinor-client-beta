  descriptions:
  - text: |-
      As palavras contidas nesta placa lhe revelam o seguinte conhecimento:
                               MAIS SOBRE VOCÊ
      Digitando GOLD, será exibido quantas moedas de ouro seu personagem está
      carregando.
      Digitando LEVEL, será exibido seu nível e sua experiência atual, a experiência
      que falta para seu personagem passar para o próximo nível. Também mostra a experiência
