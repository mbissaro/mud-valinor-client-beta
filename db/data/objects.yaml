- id: obj:cenario.nota
  name: nota
  kind: scenery
  descriptions:
  - text: |-
      A Casa de Cura
      Tanto aqui, quanto em vários locais da Terra-Média, é possível encontrar
      curandeiros que agilizam o tratamento de ferimentos e removem vários tipos
      de magias danosas, como 'Cegueira', 'Envenenamento' ou 'Maldição'.
      Outro recurso útil para recuperar pontos de vida, movimento e mana, é a
      utilização de camas, colchonetes e afins, pois ao dormir ou descansar
      sobre estes, a restauração do seu personagem ocorrerá de forma muito mais
      rápida. Portanto, aproveite os leitos da Casa de Cura dormindo neles com o
      comando SLEEP LEITO. Após recuperar-se, poderá se levantar digitando
      STAND.
      Número de pontos de vida, mana e movimento recuperados . é tanto maior
      quanto os pontos de constituição, . inteligência e destreza do personagem
      respectivamente.
      (OOC) Para mais informações, digite HELP SLEEP e HELP STAND.
