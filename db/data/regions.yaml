- id: region:bosque
  name: Amplo Bosque (wilderness ao norte da Academia)
  kind: wilderness
  safety: hostile
  danger: 3
  level_range: [1, 6]
  navigation: wilderness
  atmosphere: [selvagem, infestado-a-noite]
  tags: [caça, farm-de-gold, portal-contextual]
  notes: >
    "Floresta ao extremo norte" da Academia. Bestiário variado, farm de
    gold (bezerro/slice/Narinë). Nas bordas norte e sul há seis "pequenas
    construções de pedras" com porta, cada uma a guilda de uma classe:
    Academia de Combate (guerreiro), Gruta Profunda (ladrão), Acampamento dos
    Rangers (sul); Pequeno Templo (clérigo), Círculo Natural (druida), Torre
    Mágica (mago) (norte). Na borda leste, uma pequena trilha leva à Trilha
    de Pedras Claras, à ponte e à Vila dos Aventureiros.
  sources: ["catalogo.md", "notas.md#Amplo Bosque (nível 1)", "logs/raw.log"]
  confidence: confirmed
- id: region:vila-aventureiros
  name: Vila dos Aventureiros
  parent: region:bosque
  kind: city
  safety: safe
  danger: 1
  level_range: [1, 6]
  navigation: linear
  atmosphere: [murada, comercial, acolhedora]
  tags: [lojas, cura, taverna]
  notes: >
    Vila murada a leste do Amplo Bosque, depois da Trilha e da Ponte de
    Pedras Claras, sobre um rio. Uma rua só (Rua da Honra) entre o Portão
    Ocidental e o Portão Oriental (este sem saída), com a Praça da Coragem
    (mangueira, fonte, prefeito hobbit Trungo Tronco) no meio. Lojas de
    armaduras, utilidades, armas, roupas e magia, a Taverna Cajado Torto e a
    Casa de Cura com a curandeira Dhayme.
  sources: ["logs/raw.log"]
  confidence: confirmed

