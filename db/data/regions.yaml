- id: region:esgaroth
  name: Esgaroth, a Cidade do Lago
  kind: city
  safety: guarded
  danger: 0
  navigation: grid
  atmosphere: [mercantil, lacustre, movimentado]
  tags: [cidade-natal, ponto-de-retorno, bombas-dagua, guardas-gps]
  notes: >
    Cidade sobre palafitas no Lago Comprido, em dois níveis (plataforma de
    madeira em cima, rampas do mercado e ancoradouros embaixo). Anel de
    avenidas perimetrais (Oeste, Norte, Leste, Sul) cortado pela Avenida
    Transversal; Mercados Central e Setentrional; Ponte de Baixo. Praças com
    bomba d'água grátis; guardas levam o visitante a seis pontos fixos.
    Ponto de retorno no Coração do Mercado. Área 0-115 no comando `areas`.
  sources: ["notas.md#Esgaroth (Cidade do Lago)", "logs/raw.log"]
  confidence: confirmed

