- id: room:academia.o-oeste-do-jardim
  title: O Oeste do Jardim
  region: region:academia
  safe: false
  description: |-
    O agradável cheiro de comida vindo da janela do refeitório junto ao
    perfume agradável das lindas flores desse jardim, tornam desse lugar o
    recanto favorito dos aventureiros da academia. Os alunos usam o belo e bem
    cuidado gramado para brincar, descansar, estudar e muito mais. Nas
    árvores, os passarinhos cantam alegremente quando é dia. Já de noite,
    corujas de várias cores aparecem por aqui. Uma vez ou outra, algum animal
    do bosque resolve chegar perto da cerca, mas depois de um tempo vai
    embora.
