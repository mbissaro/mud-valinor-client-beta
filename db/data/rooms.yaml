  safe: true
  description: |-
    Regras aceitas, agora você poderá prosseguir na criação do seu
    personagem. Logo a frente, você verá uma série de instruções sobre
    como lidar com o MUD e com os comandos. Este guia foi escrito para
    personagens iniciantes, e os mais experientes podem pular esta parte
    falando "Eu não preciso de ajuda". Para prosseguir no aprendizado,
    digite PROSSEGUIR ou simplesmente N, você verá uma seqüencia de
    salas explicando o funcionamento do MUD.
  exits:
  - n
  mobs:
