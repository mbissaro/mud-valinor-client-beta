    bem verde e macio. Há animais em todo lugar... No chão, nas árvores e no
    céu. Raposas caçando, coelhos saltitando e pássaros voando são exemplos
    dessa natureza maravilhosa que cerca a Academia... O longo uivo de algum
    lobo mostra que esse recanto natural também pode ser perigoso... A trilha
