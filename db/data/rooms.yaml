    os jovens aventureiros têm tudo que precisam - ao menos enquanto estão no
    início do treinamento. Essa sala é ampla, mas mesmo assim parece pequena
    devido ao grande número de pessoas que estão aqui. As paredes são pintadas
    de branco e estão cheias de cartazes. O piso é de mármore e está bem
    limpo, apesar de um tanto quanto gasto devido ao grande número de pessoas
    que passam por aqui. Há um quadro na parede norte com uma planta da
    academia. Uma grande arcada a oeste leva ao depósito de armaduras. Ao
    leste, uma arcada leva ao depósito de armas. Outra arcada, a norte, leva
    ao corredor principal da academia. Duas escadas ocupam a parte sul, uma
