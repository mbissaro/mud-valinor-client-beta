- id: room:vila-aventureiros.loucura-ou-aventura-loja-de-utilidades
  title: Loucura ou Aventura - Loja de Utilidades
  region: region:vila-aventureiros
  safe: false
  description: |-
    Quem administra esta loja resolveu que era uma boa idéia expor o seu
    produto em cada pedaço do teto e das paredes de madeira, cobrindo-as quase
    inteiramente. Por todos os lados há bolsas, sacolas e mochilas penduradas,
    exigindo que homens e elfos desviem a cabeça ao passar. À direita da
    entrada há um balcão, com a maior parte da superfície ocupada por itens
    imprescindíveis a quem deseja se aventurar pelas perigosas estradas da
    Terra-média, tais como cantis, lamparinas e tochas. Atrás do balcão, uma
