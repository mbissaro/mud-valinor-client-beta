- id: room:bosque.a-trilha-de-pedras-claras
  title: A Trilha de Pedras Claras
  region: region:bosque
  safe: false
  description: |-
    Uma brisa amena vinda do norte acaricia o seu rosto tão logo você chega
    neste local. Uma estreita trilha de pedras claras inicia-se diante de seus
    pés, conduzindo de forma segura os viajantes entre o Amplo Bosque e o
    interior de uma verdejante floresta de árvores antigas e frondosas,
    protegida pelos elfos. A densa vegetação e uma densa névoa lhe
    impossibilita de enxergar muito adiante, mas a trilha segue para o leste.
    O som de água corrente ecoa pela mata.
