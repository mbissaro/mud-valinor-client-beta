- id: room:academia.as-regras-do-jogo
  title: As Regras do Jogo
  region: region:academia
  safe: true
  description: |-
    O MUD Valinor é um jogo online onde dezenas de jogadores podem jogar
    simultaneamente, interagindo entre si. Como você poderia imaginar, este
    jogo possui algumas regras que foram criadas para manter o respeito e a
    ordem entre jogadores e evitar qualquer espécie de desavença. O conjunto
    dessas regras, que você precisa conhecer, é chamado de Políticas de Jogo.
    Digite POLICY para lê-las. As regras estão divididas em seções, cada qual
    tratando de um assunto específico. Quando você terminar, avance digitando
    PROSSEGUIR, ou apenas N. Se por algum motivo você não aceitar alguma das
    regras, digite QUIT. Você precisa aceitar as regras para prosseguir e, ao
    continuar, você demonstra fazê-lo.
  exits:
  - n
  - s
  mobs:
  - Um guardião de pedra está aqui, ao lado do livro.
  objects:
  - Um grande livro de regras foi colocado sobre um pedestal aqui.
  links:
    n: room:academia.iniciantes-e-experientes
  visits: 2
  sources:
  - logs/raw.log:293
  confidence: confirmed
