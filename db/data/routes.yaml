# Rotas nomeadas (nao se reduzem a uma Exit simples). id: route:<slug>.
- id: route:bri-valfenda-charrete
  from: loc:bri.grande-estrada-leste-oeste
  to: loc:valfenda.bosquepraca
  mode: cart
  steps: ["sit charrete", "give 5 moedas vato", "say Leve-me para Valfenda"]
  via: [loc:estrada.ultima-ponte, loc:estrada.glorfindel, loc:estrada.vau-bruinen]
  given_by: npc:vato-nogueira
  safety: "100% automática e segura, zero combate, mesmo passando por trechos descritos como ameaçadores."
  description: "Rota completa documentada passo a passo em notas.md; a mesma sintaxe funciona pra qualquer destino do Vato Nogueira (Archet, Bri, Estrado, Fosso Branco)."
  sources: ["notas.md#MARCO ENORME: CHEGAMOS A VALFENDA (Imladris) via charrete do Vato Nogueira!"]
  confidence: confirmed

- id: route:bri-archet-a-pe
  from: region:bri
  to: region:archet
  mode: walk
  steps: [n, n, nw, nw, nw, nw, n, ne, ne, ne, ne, n]
  via: [region:eriador.estrada-norte]
  safety: "'o caminho parece bastante frequentado e não oferece perigo algum, até mesmo para os mais jovens aventureiros' — confirmado pelo próprio jogo."
  description: "Sai pelo Portão Norte de Bri; não precisa de Vato Nogueira nem de 5 gold."
  sources: ["notas.md#DESCOBERTA ENORME: chegamos em Archet a pé (seguro, sem Vato Nogueira)"]
  confidence: confirmed

