- id: text:look.look-belo
  kind: look
  title: look belo
  body: |-
    Você não pode ver nada da beleza destes cristais, pois estão cuidadosamente
    armazenados em caixotes de madeira, recheados de palha clara, para prevenir
    qualquer choque. Nos caixotes em tinta azul bem delineada, há letras toscas
    nas quais se lê 'Vale Ringló'.
  rooms:
