- id: text:help.help-mudmail
  kind: help
  title: help mudmail
  body: |-
    O comando MAIL permite mandar mensagens longas ("mudmails" para os íntimos)
    para outros jogadores e maiar do MUD Valinor, mesmo que eles não estejam
    conectados no momento. Ele é um pouco complexo, mas não é difícil de usar
    e você não precisará de todos os comandos. Para facilitar, a ajuda deste
    comando está dividida em tópicos. Digite "HELP <tópico>" para ler cada um
    deles (exemplo: "HELP MAIL INTRO").
    Comece lendo:
      MAIL INTRO                Introdução sobre o mudmail
    Ou veja a ajuda dos comandos principais:
      MAIL LIST                 Lista mensagens na sua caixa-postal
      MAIL READ ou SHOW         Mostra uma mensagem da sua caixa-postal
      MAIL UNREAD               Marca um mudmail como não-lido
      MAIL WRITE                Escreve um mudmail com o editor de texto
      MAIL TO                   Define o(s) destinatário(s) do mudmail
      MAIL SUBJECT              Define o assunto do mudmail
      MAIL POST                 Envia um mudmail escrito
      MAIL REPLY e REPLYALL     Responde a mudmails
      MAIL DELETE  e UNDELETE   Apaga e restaura mudmails
      MAIL PURGE                Limpa a lixeira
    ou os comandos rápidos para escrever mudmails sem o editor de texto:
    Próximo, Mostrar tudo, Repetir, Voltar, ou Sair: [P]
  sources:
  - logs/transcript.log
  confidence: confirmed
