- id: text:creation.o-mud-valinor-e-um-jogo-textual-e-plenamente-ace
  kind: creation
  title: O MUD Valinor é um jogo textual e plenamente acessível por p
  body: |-
    O MUD Valinor é um jogo textual e plenamente acessível por pessoas que
    precisam de tecnologias assistivas para usar um computador. Para o caso
    específico de deficientes visuais que usam sintetizadores de voz, temos
    um recurso chamado "Modo Aural" que organiza o texto de uma forma mais
    apropriada para leitura (por exemplo, substitui gráficos de barras por
    porcentagens e apresenta tabelas na ordem natural de leitura). Esse
    recurso não limita de modo algum as suas possibilidades dentro do jogo,
    mas não é muito útil se você não usa um sintetizador de voz. Por padrão
    ele também desativa as cores, mas você pode mudar isto depois se seu
    sintetizador souber interpretá-las de alguma forma. Você também poderá
    alterar essa opção depois.
     ** Se você não é deficiente visual, apenas digite N. **
    Ativar o Modo Aural? (S/N):
            M U D   V a l i n o r  -  Onde a Luz do Antigo Oeste Ainda Vive
               Algumas informações IMPORTANTES para novos jogadores.
      POLÍTICAS DE JOGO - Digite POLICY para conhecer nossas Políticas
      de Jogo. O conhecimento e aceitação destas regras é obrigatório a
      todos os jogadores do MUD Valinor.
      AUTORIZAÇÃO DE PERSONAGENS NOVOS - Alguns recursos do MUD não estarão
      disponíveis até que seu personagem seja aprovado. Mesmo assim, você
      poderá jogar e salvar seu personagem normalmente.
      ARQUIVOS DE AJUDA - Todos os comandos do MUD estão extensivamente
      documentados. Você poderá ler informações sobre eles digitando HELP.
      SAINDO DO JOGO - SEMPRE digite QUIT ao sair do jogo. Seu personagem e
      seu inventário serão salvos automaticamente. Se você fechar seu cliente
      sem usar o QUIT seu personagem ficará a mercê de qualquer eventual
      perigo!
                                [ Tecle ENTER ]
    (Seguro)
  sources:
  - logs/raw.log
  confidence: confirmed
