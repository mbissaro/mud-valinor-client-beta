    Ao observar este orbe, o seguinte conhecimento lhe é transmitido:
                                CONTÊINERS
    Contêiners são objetos especiais que possuem a capacidade de armazenar
    outros objetos em seu interior. Podem ser fixos na sala, (não podendo ser
    carregados juntos com você) tais como armários, estantes ou aquele grande baú
    repleto de tesouros que você talvez um dia desenterre, ou podem ser
    portáteis, onde mochilas, bolsas, caixinhas e tudo aquilo que possa carregar
    nas suas mãos com facilidade se enquadram.
    O conteúdo de um contêiner pode ser observado digitando EXAMINE <contêiner>
    (este comando também poderá lhe dar informações úteis para demais tipos de
    objetos).
    Para pegar um objeto que esteja dentro de um contêiner, digite GET <objeto>
    <contêiner> (por exemplo: GET anel baú) e para colocar um objeto dentro
    de um contêiner, digite PUT <objeto> <contêiner> (por exemplo: PUT cantil
    bolsa)
    Assim como as saídas, contêiners podem muitas vezes estar fechados ou até
    mesmo trancados, e para estes casos, use os comandos OPEN <contêiner>, ou
    então UNLOCK <contêiner> (estando de posse da chave do contêiner trancado)
    respectivamente. Para fechar um contêiner, digite CLOSE <contêiner> e para
    trancá-lo, desde que possua a sua chave, digite LOCK <contêiner>.
