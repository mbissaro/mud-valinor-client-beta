- id: text:look.look-orbe-7
  kind: look
  title: look orbe
  body: |-
    Ao observar este orbe, o seguinte conhecimento lhe é transmitido:
                                PREPARAÇÃO
    É importante que você entenda o seu personagem nos mínimos detalhes. A
    começar pelas escolhas que fez para ele, pois as mesmas são decisivas para
    as necessidades que ele terá ao longo do jogo. E só entendendo todas as
    possibilidades para seu personagem, que você poderá prepará-lo melhor para
    enfrentar o mundo.
    Por exemplo, se escolheu uma das classes físicas para ele (Guerreiro,
    Ladino ou Ranger), ele precisará ter atributos físicos mais altos
    (Constituição, Destreza e Força).
    Já se escolheu uma das classes mágicas para ele (Clérigo, Druida e Mago),
    ele precisará ter atributos mentais mais altos (Inteligência e Sabedoria).
    Assim como saber quais atributos dão mais benefícios para a classe que
    escolheu, você também deve saber quais os tipos de objetos são mais
    favoráveis para o seu personagem. Por exemplo, Guerreiros e Rangers
    favorecem armaduras pesadas e feitas de metal. Já Clérigos, Druidas e
    Magos não usam armaduras pesadas, evitam armaduras metálicas e acabam
    usando somente armaduras leves e orgânicas, como de couro e madeira.
    Além dos tipos de armaduras diferentes, cada uma das classes costuma ter
    um tipo de arma que melhor se adeque a mesma. Você saberá mais sobre isso
    quando seu personagem estiver perto de entrar em combate.
    Outro ponto importante de se ter em conta, é o alinhamento que escolherá
    manter para o seu personagem, pois tem itens que só podem ser usados por
    personagens bons, outros itens que só por personagens neutros e outros que
    só por personagens maus.
    Não deixe de ler os tópicos de ajuda da raça e da classe que escolheu para
    o seu personagem para descobrir as melhores opções para ele durante o
    jogo. Para isso digite HELP NOME_DA_CLASSE ou HELP NOME_DA_RAÇA.
    Para continuar seus estudos, chame o professor falando no SAY PROFESSOR.
  rooms:
  - room:academia.a-sala-da-preparacao
  sources:
  - logs/transcript.log
  confidence: confirmed
- id: text:look.look-orbe-8
  kind: look
  title: look orbe
  body: |-
    Ao observar este orbe, o seguinte conhecimento lhe é transmitido:
                                 PORTAS
    Pode ocorrer que algumas vezes você se depare com uma saída por onde não
    consiga passar livremente, pois há uma porta fechada naquela direção.
    Quando uma saída está fechada ou trancada, ela será indicada com um ponto
    de exclamação do lado da saída (por exemplo: Saídas: e u !n - a saída para
    o norte se encontra fechada e/ou trancada).
    Para abrir uma porta fechada, digite OPEN <nome da saída ou direção> (no
    exemplo anterior, para abrir a porta você digitaria OPEN N), se a porta
    estiver trancada, você precisará da chave que a destranque. De posse da
    chave, o comando para destrancar será UNLOCK <nome da saída ou direção> e após
    isso ainda deve-se abrir a porta com OPEN <nome da saída ou direção>.
    Também é possível fechar uma porta aberta digitando CLOSE <nome da saída ou
    direção> e até mesmo trancá-la, desde que possua a chave; para isso, digita-se
    LOCK <nome da saída ou direção>.
    Vale lembrar que, saídas enterradas, ocultas e secretas também podem estar
    trancadas.
    OBS: Em objetos que possuam portas e tampas também usa-se os comandos
    OPEN, UNLOCK, CLOSE e LOCK para manipulá-los.
    Para seguir adiante, você terá que abrir uma das portas desta sala.
