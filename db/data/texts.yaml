- id: text:speech.o-guarda
  kind: speech
  title: O guarda
  body: |-
    O guarda sussurrou para você 'Tenha cuidado, Halbarion... seu lugar é na Academia de Aventureiros, tente não sair da vila de Bri ou encontrará perigos!'
    O guarda sussurrou para você 'Se precisar de informações, olhe (LOOK) para mim.'
    O guarda sussurrou para você 'Você não parece experiente o bastante para estar aqui. Volte para a Academia de Aventureiros, ou não se distancie da cidade.'
    O guarda sussurrou para você 'Tentamos manter Bri segura, mas fora dela não podemos fazer nada. Se estiver perdido, RECITE este pergaminho e olhe (LOOK) para o Guardião do Norte.'
    O guarda sussurrou para você 'Saudações! Caso precise de ajuda, basta dizer 'preciso de ajuda' a mim.'
    O guarda sussurrou para você 'Salve, cidadão! Precisa de alguma informação? Posso ajudá-lo com algumas localizações da vila de Bri e seus arredores.'
    O guarda sussurrou para você 'Quando precisar, basta olhar para mim.'
    O guarda sussurrou para você 'Opa! Ajudarei você indicando as direções para os lugares, mas espero que você aprenda a andar pela região.'
    O guarda sussurrou para você 'Para obter informações de como chegar em algum lugar, basta me dizer o nome do local, por exemplo, 'Academia dos Aventureiros'.'
    O guarda sussurrou para você 'Os locais são: A Praça de Bri, Academia de Aventureiros, Archet, Valfenda, A Grande Estrada do Leste, Animais de Estimação, Armorial, Biblioteca de Bri, Casa-Mathom, Correio, Ervas e Cachimbos, Loja de Armamentos, Loja de Roupas, Oficina do Ferreiro, Penas e Papéis, Pônei Saltitante, Seção de Alimentos, Utilidades.'
    O guarda sussurrou para você 'Há placas por toda a vila de Bri. Caso se perca, examine uma delas e terá indicações.'
