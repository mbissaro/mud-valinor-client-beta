- id: text:creation.agora-voce-precisa-escolher-a-raca-do-seu-person
  kind: creation
  title: Agora você precisa escolher a raça do seu personagem. Apenas
  body: |-
    Agora você precisa escolher a raça do seu personagem. Apenas as raças dos
    povos livres da Terra-média podem ser usadas e esta escolha influenciará
    os atributos físicos e habilidades inatas do seu personagem.
    Digite o nome de uma raça da lista abaixo ou "HELP nome-da-raça" para ver
    mais informações a respeito. Digite "VOLTAR" para voltar à opção anterior.
        * Humano
        * Elfo
        * Anao
        * Hobbit
        * Meio-Elfo
    Raça: Assim como os Elfos surgiram junto ao Surgimento das Estrelas, os Homens
    vieram com o Nascer do Sol. Na terra que os Elfos chamavam de Hildorien,
    "terra dos seguidores", que ficava no extremo leste da Terra-média,
    os Homens pela primeira vez abriram os olhos para a nova luz. Ao
    contrário dos Elfos, Homens eram mortais e, mesmo pela medida dos Anões,
    de vida curta. Em força de corpo ou nobreza de espírito os Homens eram
    pobremente comparados ao povo Élfico. Era uma raça mais fraca que sucumbia
    rapidamente a pestilências e outros elementos rudes do Mundo. Por essas
    razões os Elfos os chamaram de Engwar, "os doentios". Mas os Homens eram
    teimosos como raça, e aumentavam de número mais rápido que qualquer
    outro povo exceto os orcs, e apesar do grande número que perecia eles
    se multiplicaram novamente e finalmente obtiveram sucesso nas terras a
    leste, e então foram chamados de Usurpadores.
    Morgoth encontrou seu caminho naquela terra e nos Homens, pois naquela
    região encontrou um povo que poderia facilmente sobrepujar à sua vontade.
    Alguns fugiram de seu mal e espalharam-se para o Oeste e para o
    Norte. Eventualmente eles alcançaram Beleriand, e os Reinos dos Elfos
    Noldorin. Os Noldor aceitaram a lealdade desses homens e os chamaram de
    Atani, "os segundos a nascer", mais tarde, como grande parte do povo de
    Beleriand falava a língua dos Elfos-cinzentos, eles eram mais comumente
    chamados de Edain, os "segundos".
    Raça:
  sources:
  - logs/raw.log
  confidence: confirmed
