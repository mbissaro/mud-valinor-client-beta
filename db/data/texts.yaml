  body: |-
    'A VILA DOS ANÕES' 'VILA DOS ANÕES' 'VILA DOS ANOES'
    Descrição
    A vila dos anões apresenta uma história confusa... De forma desconhecida
    (talvez por intermédio de alguns anões que visitavam os Bolseiros no
    Condado), os anões do Leste descobriram a existência de grandes jazidas
    neste ponto da Terra-Média. Assim, após longa conversa alimentada por sua
    gana pelos metais e pedras, eles vieram num pequeno grupo explorá-las; como
    a terra ficava distante de Bri, e os homens da região aparentemente
    desconheciam suas riquezas ou simplesmente não tinham habilidade em mineração,
    os anões terminaram se instalando e formando sua pequena vila.
