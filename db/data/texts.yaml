- id: text:creation.para-comecar-escolha-um-nome-para-seu-personagem
  kind: creation
  title: Para começar, escolha um nome para seu personagem. Este nome
  body: |-
    Para começar, escolha um nome para seu personagem. Este nome está sujeito
    às seguintes condições:
     * Deve conter apenas letras. Não é possível usar caracteres acentuados,
       números, espaços, símbolos ou sinais de pontuação;
     * Deve ser adequado ao universo tolkieniano, porém não pode ser o nome de
       um personagem existente nas obras (esses nomes são usados pelos NPCs);
     * Não pode ser ofensivo, impronunciável, futurista ou fortemente associado
       a algum personagem histórico, mitológico ou a outro universo ficcional;
     * Não coloque um sobrenome ou título (eles são definidos depois, conforme
       a família e as associações do seu personagem).
    Você começará a jogar imediatamente, porém o nome escolhido será enviado
    para aprovação e uma mudança pode ser solicitada. Isto não prejudicará
    seu progresso no jogo e, após a aprovação, não será mais possível trocar
    de nome.
    Nome do personagem: Seu nome está correto, Halbarion (Sim/Não)?
  sources:
  - logs/raw.log
  confidence: confirmed
