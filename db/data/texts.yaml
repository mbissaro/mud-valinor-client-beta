- id: text:help.help-vato-nogueira
  kind: help
  title: help vato nogueira
  body: |-
    Vato Nogueira é um NPC que atua como cocheiro de aluguel em Bri e oferece
    transporte para vilas próximas mediante pagamento. Normalmente ele espera
    por clientes nas redondezas da praça de Bri, mas também aguarda seus por
    algumas horas próximo ao destino da sua última corrida.
    Como muitos NPCs do MUD Valinor, Vato responde a algumas frases e ações bem
    definidas. Três passos são necessários para viajar: acomodar-se sobre a
    charrete, pagar pela corrida e solicitar o destino.
    Cada corrida custa cinco moedas, que devem ser entregues com o comando GIVE.
    Vato é particularmente cuidadoso com o dinheiro recebido e lembrará quantas
    moedas lhe foram dadas, mesmo depois de você desconectar ou o MUD reiniciar.
    Seu personagem pode pagar de forma fracionada e ele pedirá para completar o
    valor; Após isto, seu personagem pode usá-la quando bem entender e, se seu
    personagem entregar mais que cinco moedas, Vato lembrará do crédito adicional
    nas próximas viagens. Isto é útil para certas viagens arriscadas: basta pagar
    antecipadamente e seu personagem poderá retornar mesmo sem ter dinheiro em
    mãos no momento da partida.
    Paga a viagem, solicite o destino dizendo "Leve-me para cidade-de-destino";
    que pode ser Valfenda, Archet, Bri, Estrado e Fosso branco.
    Próximo, Mostrar tudo, Repetir, Voltar, ou Sair: [P]
  sources:
  - logs/transcript.log
  confidence: confirmed
- id: text:help.help-anao
  kind: help
  title: help anao
  body: |-
    Em um grande salão sob as montanhas da Terra-média Aulë, o Ferreiro
    dos Valar, moldou os Sete Pais dos Anões durante as Eras da Escuridão,
    quando Melkor e seus servos malignos em Utumno e Angband mantinham o
    poder sobre toda a Terra-média. Por isso Aulë fez os Anões robustos e
    fortes, não afetáveis por frio e fogo, e a mais vigorosa das raças que
    se seguiram. Aulë conhecia o grande mal de Melkor, então fez os Anões
    teimosos, indomáveis e persistentes no trabalho e emergências. Eram
    bravos na batalha e seu orgulho e vontade não podiam ser quebrados.
    Os Anões são mineiros das profundezas, pedreiros, trabalhadores em metal e
    os mais fantásticos escultores em pedra. São bastante adaptados as artes
    de Aulë, que deu forma as montanhas, por isso foram feitos fortes, duros
    e com longas barbas, mas não altos, tendo de 1,20m a 1,50m de altura. Com
    seu trabalho era longo, foi-lhes dada uma vida de cerca de dois séculos
    e meio, e são mortais; e também podem ser mortos em batalha. Aulë fez os
    Anões sábios com o conhecimento de seus trabalhos e deu-lhes uma linguagem
    chamada Khuzdûl. Nessa língua Aulë foi chamado Mahal e os Anões Khazad,
    mas é uma língua secreta e desconhecida, a não ser por poucas palavras,
    para todos exceto os Anões, que a guardam com ciúmes. Os Anões sempre
    agradecem a Aulë e reconhecem que através dele foi lhes dada vida real
    pelo poder de Ilúvatar.
    Raça:
  sources:
  - logs/transcript.log
  confidence: confirmed
- id: text:help.help-esgaroth
  kind: help
  title: help esgaroth
  body: |-
    Descrição
    Esgaroth, também chamada Cidade do Lago, foi construída sobre a superfície
    de Lago Comprido e é habitada por homens. Localizada ao sul da Montanha
    Solitária e leste da Floresta das Trevas, ela é um grande ponto comercial.
    Esgaroth foi uma cidade grande, rica e poderosa, devido ao seu poder
    mercantil e rota comercial; ela está no caminho da mercadoria que vem de
    Dorwinion e chega até o Reino Élfico de Thranduil na Floresta das Trevas.
    Assim, para além de pescadores, a cidade passou a ter mercadores e
    barqueiros, que cobravam quantias modestas por acelerar este tráfego
    comercial. A vinda do dragão Smaug na terceira era em 2770 prejudicou essa
    atividade e instaurou o pânico com ataques esporádicos.
    A chegada da companhia de Thorin Escudo de Carvalho e os acontecimentos
    desencadeados dela culminaram no ataque do dragão Smaug à cidade, que acabou
    destruída, embora o dragão tenha sido morto por Bard. Desde então, a cidade
    foi reconstruída num ponto mais acima do lago e o ritmo do comércio  antigo
    foi recuperado, enriquecido ainda pela mercadoria de Valle.
    Informações Gerais
    Tipo de área:
    Próximo, Mostrar tudo, Repetir, Voltar, ou Sair: [P]
