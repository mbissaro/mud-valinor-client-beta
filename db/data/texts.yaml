  body: |-
    Ao observar este orbe, o seguinte conhecimento lhe é transmitido:
                                HABILIDADES
    As habilidades podem ser perícias ou magias. Cada classe tem um grande
    número delas. Elas permitem que seu personagem lute de maneira mais
    eficiente do que apenas com armas, além de ajudar o mesmo no dia-a-dia de
    muitas outras maneiras.
    Seu personagem pode usar magias de invisibiliddade e de voar para explorar
    lugares desconhecidos; perícias para arrombar portas ou desfazer
    armadilhas para entrar em lugares perigosos; dentre tantas outras
    possibilidades físicas e mágicas.
    Para ver as habilidades recomendadas para o seu personagem aprender no
    nível atual, digite PRACTICE. Você verá também a proficiência nas que ele
    já aprendeu. Para ver uma lista de todas as habilidades da classe atual,
    digite SLIST.
    Não deixe de ler o HELP PRACTICE e o HELP SLIST.
    Para aprender uma habilidade, seu personagem precisará ter os pontos de
    prática, as moedas de ouro e quaisquer outros requisitos mínimos
    necessários que cada habilidade exige. Para saber mais informações sobre
    uma habilidade específica, digite PRACTICE INFO "NOME_DA_HABILIDADE" ou
    PRAC INFO "NOME_DA_HABILIDADE". Com isso, será exibido as informações de
    como usar a habilidade, o que é preciso para aprendê-la e quais mestres a
    ensinam.
    Para continuar seu aprendizado, examine a placa fixada na parede. Para
    isso digite EXAMINE PLACA.
    O professor Rodhvan faz algumas anotações.
