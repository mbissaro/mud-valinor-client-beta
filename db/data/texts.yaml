- id: text:look.look-curandeiro
  kind: look
  title: look curandeiro
  body: |-
    OPA! Um passo atrás! Ele chega perto, e é impossível não ficar impressionado
    com a inspeção que ele faz... Esse homem magro, pálido como giz, parece tão
    excêntrico quanto somente um lunático seria; o s seus olhos claros emitem um
    brilho paranóico, mas suas roupas e suas maneiras pomposas se dividem entre
    algo de ares místicos e de ciência. Você não imagina o quanto essa figura tão
    carismática é procurada! Se houver algo de errado em você, e ele descobrirá!
    O curandeiro alucinado está perfeitamente saudável.
    O curandeiro alucinado está usando:
    <nas orelhas>     um par de brincos com poderes curativos
    <no corpo>        uma túnica manchada por poções
    <nos braços>      (Brilhando) um bracelete de contra-maldição
    <no pulso>        uma pulseira de athelas seca trançada
    <empunhando>      uma cureta de prata de lei
    <nas pernas>      um par de calças surradas
    <nos pés>         uma modesta sandália de tiras
  rooms:
  - room:esgaroth.no-ancoradouro-de-mercadorias-frageis
  sources:
  - logs/transcript.log
  confidence: confirmed
- id: text:look.look-dantalion
  kind: look
  title: look dantalion
  body: |-
    Este senhor de aparência nobre possui vestes que se faz perceber
    com facilidade que não é da região, sem contar os maneirismos e
    interesse com que observa cada detalhe, além do carregado sotaque ao falar.
    É comum várias pessoas o procurarem para receberem algum tipo de
    conselho e sua sabedoria e eloquencia não desapontam ninguém.
    Dantalion está usando:
    <no pescoço>      um medalhão de ferro
    <sobre o corpo>   uma túnica roxa
    <segurando>       um grosso livro de ciências
    <na cintura>      uma faixa vermelha
    <nos pés>         sapatos de couro de carneiro
    Dantalion está perfeitamente saudável.
  rooms:
  - room:esgaroth.avenida-perimetral-leste-13
  - room:esgaroth.no-lado-oeste-do-mercado-central-2
  - room:esgaroth.praca-montanha-solitaria
  sources:
  - logs/transcript.log
  confidence: confirmed
