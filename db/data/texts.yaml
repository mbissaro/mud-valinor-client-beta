- id: text:help.policy
  kind: help
  title: policy
  body: |-
    Políticas de jogo do MUD Valinor
    Ao jogar o MUD Valinor, você está automaticamente concordando e se sujeitando
    às nossas regras. Isso inclui as regras e políticas descritas neste documento
    e as decisões tomadas pelos administradores do jogo.
    Os administradores são chamados de Maiar e cabe a eles o desenvolvimento, a
    manutenção, a segurança e integridade funcional do jogo.
    É proibido se passar por um administrador do jogo, não importa a maneira (IC
    ou OOC), em qualquer hipótese. Isso quer dizer que é proibido se fingir de
    Maia ou dizer que age em nome de um para dar ordens, informações, notícias,
    advertências, recriminações ou quaisquer outras ações administrativas. Não
    haja como um Maia sem ser de fato um ou as consequências podem ser bastante
    desagradáveis.
    O MUD Valinor está em constante desenvolvimento. Mais especificamente, isso
    significa que:
       - Áreas novas estão em desenvolvimento e as velhas estão sendo melhoradas;
       - NPCs, objetos e salas podem mudar a qualquer momento;
       - NPCs, objetos e salas podem ser lançados para testes e mais tarde serem
       apagados;
    Próximo, Mostrar tudo, Repetir, Voltar, ou Sair: [P]
  sources:
  - logs/transcript.log
  confidence: confirmed
- id: text:help.policy-4
  kind: help
  title: policy 4
  body: |-
    Continuação - Digite POLICY 3 para ler a parte anterior.
    ** 4 - Multiconexão e automação de personagens são proibidas **
    Todos os jogadores que se interessarem por ter mais de um personagem no MUD
    devem, no ato de sua criação, enviar um MUDMAIL para ao menos dois Maiar,
    registrando seu novo personagem, com referência ao personagem principal.
    É proibido, sob qualquer hipótese, ter dois ou mais personagens carregados
    simultaneamente. Isso é chamado multiconexão. É proibido mesmo que os
    personagens não interajam. Se um personagem está desconectado (pois saiu sem
    usar o comando QUIT ou a conexão caiu), é proibido entrar com outro
    personagem, pois isso é o mesmo que multiconexão. A única forma permitida
    para uso de dois personagens é sair do jogo com QUIT e só após entrar com o
    outro personagem. A quebra desta regra pode ter consequências graves.
    Se você compartilha uma rede, os maiar verão dois personagens do mesmo IP.
    Certamente alguém virá questioná-lo sobre multiconexão. Explique que se trata
    de uma rede compartilhada sempre que solicitado.
    São terminantemente proibidas a partilha, a troca, a venda ou a locação de
    personagens. Assim, dois personagens registrados como pertencentes a um mesmo
    jogador não devem JAMAIS estar online simultaneamente, significando pena por
    Próximo, Mostrar tudo, Repetir, Voltar, ou Sair: [P]
  sources:
  - logs/transcript.log
  confidence: confirmed
- id: text:help.help-areas
  kind: help
  title: help areas
  body: |-
    Sintaxe:  areas
    Sintaxe:  areas old
    Sintaxe:  areas <nível mínimo> <nível máximo>
    O comando 'AREAS' irá mostrar uma lista, ordenada alfabeticamente, de todas
    as áreas no jogo, junto com o autor e o nível apropriado para cada área.
    O comando 'AREAS OLD' irá mostrar uma lista desordenada de todas as áreas
    (no velho estilo), bem como o autor e o nível apropriado para cada área.
    Você pode especificar uma faixa de níveis para ver uma lista de todas as
    áreas sugeridas. Por exemplo, um personagem do nivel 10 que quer saber
    a área apropriada para ele digitaria: 'AREAS 7 13'. O resultado seria
    uma lista de áreas que estão nesta faixa de níveis.
    Para Maiar: o comando 'AREAS ALL' listará todas as áreas no jogo, inclusive
    as ocultas.
  sources:
  - logs/transcript.log
  confidence: confirmed
- id: text:help.book-livro-read-1
  kind: help
  title: book livro read 1
  body: |-
    Os Poderes de Arda - Página 1
    Quando Ëa, o "Mundo Que É", foi dado substância, nele veio a residir
    uma parte da primeira raça, os Ainur, os "Sagrados". Nos Salões Eternos
    eram seres de puro espírito que o "Valaquenta" registra terem entrado no
    Mundo e, tomando uma forma terrena, se dividiram em dois povos. O povo
    que era menos poderoso e mais numeroso e sua história é contada como os
    Maiar; os maiores poderes eram quinze em número e são considerados Valar,
    os Poderes de Arda.
  sources:
  - logs/transcript.log
  confidence: confirmed
- id: text:help.book-livro-read-2
  kind: help
  title: book livro read 2
  body: |-
    Os Poderes de Arda - Página 2
    É dito em livros antigos que, quando os Valar e Maiar vieram e moldaram
    a aspereza do Mundo, desejavam construir a beleza perfeita que tinham
    visto na Visão. Mas houve disputa entre os Valar e a guerra estragou seus
    trabalhos. Mas ao menos o primeiro reino dos Valar, chamado, Almaren,
    foi feito em uma ilha no meio de um vasto lago na Terra-média, e todo o
    Mundo foi iluminado pelas duas Lâmpadas brilhantes que estavam no Norte
    e Sul. Então começou a Era das Lâmpadas. Mas um dos Valar se revoltou
    e quebrou as Grandes Lâmpadas dos Valar e destruiu a Ilha de Almaren e
    seus jardins encantados.
  sources:
  - logs/transcript.log
  confidence: confirmed
- id: text:help.book-livro-read-3
  kind: help
  title: book livro read 3
  body: |-
    Os Poderes de Arda - Página 3
    Então os Valar deixaram a Terra-média e foram para o Oeste para o
    Continente de Aman, onde colocaram as Montanhas Pelóri ao redor deles e
    fizeram seu segundo reino e mansões ainda mais belas que no primeiro. Seu
    reino foi chamado Valinor, e sua cidade de domos, sinos e grandes salas
    foi chamada Valimar. A este tempo as Árvores dos Valar, que forneciam
    luz eterna, dourada e prateada, foram feitas e toda a Mana foi iluminada
    até as bordas das Pelóri; e o reino era um milagre de beleza.
  sources:
  - logs/transcript.log
  confidence: confirmed
