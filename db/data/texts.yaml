- id: text:help.book-cuivienyarna-read-1
  kind: help
  title: book cuivienyarna read 1
  body: |-
    Cuivienyarna - A Lenda do Despertar dos Quendi - Página 1
    Enquanto seus primeiros corpos estavam sendo feitos da "carne de Arda", os
    quendi dormiam "no seio da terra", debaixo do verde gramado, e despertaram
    quando tornaram-se adultos. Mas os Primeiros Elfos [também chamados de
    Não-Nascidos, ou Nascidos de Eru] não acordaram todos ao mesmo tempo. Eru
    havia então determinado que cada um deveria estar ao lado de seu/sua
    "parceiro[a] destinado". Mas três elfos despertaram antes de todos,
    e eles eram elfos homens, pois elfos homens são mais fortes fisicamente
    e mais ávidos e aventureiros em lugares estranhos. Estes três pais elfos
    são chamados nos contos antigos Imin, Tata e Enel. Eles despertaram nessa
    ordem, mas com pouca diferença de tempo entre cada um; e a partir deles,
    dizem os eldar, as palavras um, dois e três foram feitas: os mais antigos
    de todos os numerais.
  sources:
  - logs/transcript.log
  confidence: confirmed
