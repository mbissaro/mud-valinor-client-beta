  body: |-
    Orcs - A Raça Corrompida - Página 1
    Dentro dos mais profundos Poços de Utumno, na Primeira Era das Estrelas,
    é dito que Melkor cometeu sua maior blasfêmia. Por àquele tempo ele
    capturou muitos dentre a recentemente surgida raça dos Elfos e prendeu-os
    em suas masmorras, e com atos horríveis de torura ele fez formas de
    vida arruinadas e terríveis. Destes ele criou uma raça escrava, Orcs,
    que eram tão repulsivos quanto os Elfos eram belos.
