- id: text:look.look-lainever
  kind: look
  title: look lainever
  body: |-
    Lainever devolve seu olhar de forma indiferente, quase rabugenta talvez.
    Ele parece ocupado em se arrastar pelas ruas de Esgaroth, deitando seu
    olhar sonso e desconfiado nos viajantes. Sempre sério, e muito magro, é
    caracterizado por suas olheiras ganhadas nas noites passadas na Taverna do
    Dragão.
    O guarda Lainever está perfeitamente saudável.
    O guarda Lainever está usando:
    <como luz>        um pequeno lampião
    <na cabeça>       um elmete de ferro reluzente
    <sobre o rosto>   uma fina cimeira de ferro
    <no pescoço>      um gorjal de ferro gasto
    <no corpo>        um peitoral de ferro
    <nos braços>      um par de cubiteiras de ferro
    <nas mãos>        um par de manoplas de couro
    <no dedo>         um anel dos guardas da cidade
    <empunhando>      uma espada esclavônia
    <como escudo>     um escudo com as armas de Esgaroth
    <na cintura>      um cinto de couro
