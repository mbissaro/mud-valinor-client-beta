- id: text:help.help-mail-qp
  kind: help
  title: help mail qp
  body: |-
    MAIL QP <destinatários> <texto da mensagem curta>
        Manda uma mensagem curta para os destinatários indicados. A mensagem é
        limitada ao comprimento máximo de uma linha de texto do mud (cerca de
        250 caracteres) e será enviada em uma única linha no texto do mudmail.
        Os primeiros 65 caracteres também serão colocados no campo do assunto.
        Não há nenhuma outra diferença entre um mudmail comum e um criado com
        este comando, a vantagem é poder mandar rapidamente uma mensagem curta
        sem precisar do editor de texto.
        Cuidado! Ao enviar para mais de um destinatário, use vírgulas para
        separar um nome do outro sem nenhum espaço adicional ou coloque-os
        entre 'aspas simples'. Por exemplo, os comandos
            MAIL QP astolfo,felisbino Tive que sair e não pude esperar vocês.
            MAIL QP 'astolfo, felisbino' Tive que sair e não pude esperar vocês.
        tem exatamente o mesmo efeito: mandam um mudmail com apenas o texto
        "Tive que sair e não pude esperar vocês." para os jogadores Astolfo e
        Felisbino.  Porém, o contra-exemplo abaixo está ERRADO:
            MAIL QP astolfo, felisbino Este é um exemplo errado.
    Próximo, Mostrar tudo, Repetir, Voltar, ou Sair: [P]
  sources:
  - logs/transcript.log
  confidence: confirmed
- id: text:help.help-ponto-de-retorno
  kind: help
  title: help ponto de retorno
  body: |-
    O ponto de retorno é o local para onde seu personagem retorna após a
    morte, ou após executar a magia retorno. Ele é alterável por cada um,
    conforme a necessidade e vontade do jogador. Alterar o ponto de retorno
    inclui pagamento de taxa ao responsável pela região, as taxas são
    diferentes entre áreas. Não há custo para redefinir seu retorno para sua
    cidade natal'.
    Lista de Pontos de Retorno
    Bri  - Avenida Zenite (Guardião do Norte)
    Archet  - Rua dos Ofícios (Umaro)
    Valfenda  - Bosquepraça (Guardiã Elfa)
    Esgaroth - No Centro de Esgaroth: o Coração do Mercado(Brandivaus)
    Fosso Branco  - Balofofo
    Acampamento de Aventureiros  - Porlo
    Acampamento Norte do Vale do Anduin - Artel
    Vila dos Elfos Jangadeiros - Ehtelë
    Por exemplo, se estiver em Bri e desejar se mudar para lá, encontre o guardião
    do norte e fale 'Quero me mudar para Bri!'. Os demais guardiões reagem de forma
    similar. Porlo, Balofofo e Artel contentam-se em receber a quantia exigida
    para se manter em seus acampamentos. Basta entregar-lhes o dinheiro que é
    Próximo, Mostrar tudo, Repetir, Voltar, ou Sair: [P]
  sources:
  - logs/transcript.log
  confidence: confirmed
