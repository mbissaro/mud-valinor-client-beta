- id: text:look.examine-placa-4
  kind: look
  title: examine placa
  body: |-
    As palavras contidas nesta placa lhe revelam o seguinte conhecimento:
    Após ter iniciado um combate, caso você perceba que terá poucas chances de
    vencer, você poderá fugir para um local seguro digitando FLEE. Este comando
    fará você perder uma pequena porcentagem da sua experiência, porém, inferior
    a quantia que você perde quando morre; além disso, alguns mobs poderão ainda
    irem atrás de você.
    Você poderá também configurar para que o seu personagem fuja automaticamente
    após ter os seus pontos de vida diminuidos até um certo valor, o comando
    para isso é WIMPY <valor> (por exemplo: ao digitar WIMPY 3, o seu personagem
    tentará fugir do combate assim que seus pontos de vida estiverem iguais ou
    inferiores a 3).
    Uma maneira de você acompanhar os status do seu personagem rapidamente e o
    status dos inimigos dele também, é através do PROMPT e FPROMPT. Leia o
    HELP PROMPT para mais informações.
    Existem configurações importantes para combates, não deixe de ler o HELP
    CONFIG para saber mais sobre as possibilidades, principalmente as opções
    AUTOGOLD, AUTOLOOT, AUTOSAC e NICE.
    Para continuar seu treinamento, fale com a professora desta sala, digitando SAY PROFESSORA.
    A professora Bhieda faz algumas anotações.
  rooms:
  - room:academia.a-sala-do-combate
  sources:
