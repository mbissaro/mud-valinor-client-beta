  title: examine orbe
  body: |-
    Ao examinar este orbe, o seguinte conhecimento lhe é transmitido:
                                  OBSERVAÇÃO
    A ação mais simples que você poderá executar no MUD será o ato de observar, e
    como tudo o que será encontrado aqui estará em forma de texto, olhar e saber
    interpretar as informações mostradas na tela é a chave para o bom entendimento
    do jogo e de seus mais variados desafios propostos.
    Quando você entra em uma sala a primeira coisa que aparecerá será o título
    dela seguido de um texto contendo a descrição da mesma. Logo abaixo são
    mostradas as saídas óbvias da sala (você logo aprenderá sobre elas) e
    finalmente haverá uma listagem com os objetos e personagens que estão no
    local.
    O comando para olhar é LOOK <palavra>, sendo que <palavra> deve ser trocado
    pelo objeto ou pessoa que esteja na sala e que você deseje ver. Digitando
    apenas LOOK, você olha para a sala tal como ela é notada assim que entra
    nela.
    Além do LOOK, você pode usar também os comandos EXAMINE e o GLANCE.
    Você perceberá que o EXAMINE é mais utilizado para observar itens e o
    glance mais para fazer observações rápidas dos lugares e criaturas.
    OBS: Assim como o LOOK, o EXAMINE e o GLANCE também aceitam argumentos,
    experimente
    "GLANCE PROFESSOR".
    Para mais informações sobre cada um deles, você pode consultar os
    respectivos tópicos de ajuda, basta digitar: HELP EXAMINE, HELP GLANCE e
    HELP LOOK.
    Ao longo do jogo, tente observar os elementos importantes contidos nas
    descrições das salas, tal como as janelas contidas na descrição desta.
