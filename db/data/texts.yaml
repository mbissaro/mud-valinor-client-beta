  body: |-
    Ao observar este orbe, o seguinte conhecimento lhe é transmitido:
                              AJUDA
    Até agora você conheceu alguns comandos úteis do MUD e ao longo do
    tutorial conhecerá outros tantos. De início eles parecerão muitos e será
    comum você se esquecer de algum em momentos que possa precisar.
    Mas, não se preocupe, tudo o que aprendeu poderá ser revisto com muito
    mais detalhes usando o comando HELP. Ao digitar HELP aparecerá para você
