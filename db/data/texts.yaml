- id: text:look.look-tourvigouh
  kind: look
  title: look tourvigouh
  body: |-
    Tourvigouh caminha pelas ruas de bom humor, cantarolando baixinho alguma
    canção ensinada pelo pai. Seus longos cabelos negros batem pelos ombros e a
    barba bem aparada reforça sua aparência de homem de ação, forte, e
    decidido. Ele é de uma família modesta e sua decisão de servir a guarda da
    cidade reflete sua coragem e honra. Os fiapos de roupas visto sob a
    armadura estão quase miseráveis, mas ele parece não se importar: permanece
    guardando a cidade e cantando cantigas sobre os humildes trabalhadores do
    lago e até do mar.
    O guarda Tourvigouh está perfeitamente saudável.
    O guarda Tourvigouh está usando:
    <como luz>        um pequeno lampião
    <na cabeça>       um elmete de ferro reluzente
    <nos olhos>       uma fina cimeira de ferro
    <no pescoço>      um gorjal de ferro gasto
    <no corpo>        um peitoral de ferro
    <nos braços>      um par de cubiteiras de ferro
    <nas mãos>        um par de manoplas de couro
    <no dedo>         um anel dos guardas da cidade
    <empunhando>      uma espada esclavônia
    <como escudo>     um escudo com as armas de Esgaroth
    <na cintura>      um cinto de couro
    <nas pernas>      um saio de malhas de ferro
    <nos pés>         um par de botas da guarda
    O guarda Tourvigouh exclamou 'Olá Dorgrin! Perdido? Se quiser que eu leve você até algum lugar da cidade, basta pedir!'
    (OOC) Para ser levado, basta teclar o número:
    [1] Centro de Esgaroth: o Coração do Mercado (Retorno)
    [2] Na Estrada do Lago: Entrada para a Grande Ponte (Entrada da Academia)
    [3] No Ancoradouro Abarrotado (Alastor e saída para Rio da Floresta ao norte)
    [4] Praça da Flechada Precisa (Centro-Sul da Cidade)
    [5] Praça Floresta das Trevas (Nordeste da Cidade)
    [6] Praça Montanha Solitária (Sudeste da Cidade)
  rooms:
  - room:esgaroth.avenida-perimetral-leste-2
  sources:
  - logs/transcript.log
  confidence: confirmed
