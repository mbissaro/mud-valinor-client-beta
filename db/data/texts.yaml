- id: text:look.examine-orbe-13
  kind: look
  title: examine orbe
  body: |-
    Ao observar este orbe, o seguinte conhecimento lhe é transmitido:
                                HABILIDADES
    As habilidades podem ser perícias ou magias. Cada classe tem um grande
    número delas. Elas permitem que seu personagem lute de maneira mais
    eficiente do que apenas com armas, além de ajudar o mesmo no dia-a-dia de
    muitas outras maneiras.
    Seu personagem pode usar magias de invisibiliddade e de voar para explorar
    lugares desconhecidos; perícias para arrombar portas ou desfazer
    armadilhas para entrar em lugares perigosos; dentre tantas outras
    possibilidades físicas e mágicas.
    Para ver as habilidades recomendadas para o seu personagem aprender no
    nível atual, digite PRACTICE. Você verá também a proficiência nas que ele
    já aprendeu. Para ver uma lista de todas as habilidades da classe atual,
    digite SLIST.
    Não deixe de ler o HELP PRACTICE e o HELP SLIST.
    Para aprender uma habilidade, seu personagem precisará ter os pontos de
    prática, as moedas de ouro e quaisquer outros requisitos mínimos
    necessários que cada habilidade exige. Para saber mais informações sobre
    uma habilidade específica, digite PRACTICE INFO "NOME_DA_HABILIDADE" ou
    PRAC INFO "NOME_DA_HABILIDADE". Com isso, será exibido as informações de
    como usar a habilidade, o que é preciso para aprendê-la e quais mestres a
    ensinam.
    Para continuar seu aprendizado, examine a placa fixada na parede. Para
    isso digite EXAMINE PLACA.
  rooms:
  - room:academia.a-sala-das-habilidades
  sources:
  - logs/transcript.log
  confidence: confirmed
- id: text:look.examine-placa-6
  kind: look
  title: examine placa
  body: |-
    As palavras contidas nesta placa lhe revelam o seguinte conhecimento:
                                APRENDENDO
    Após estudar o conteúdo do orbe, você JÁ sabe tudo o que precisa para
    conseguir as informações das habilidades que deseja que o seu personagem
    obtenha, como quais mestres a ensinam e os custos para que eles lhe a
    ensinem.
    Ou seja, ao ter os requisitos mínimos necessários para aprender a
    habilidade que deseja, você precisará ir até onde está o mestre da
    habilidade em questão e lá digitar PRACTICE "NOME DA HABILIDADE" ou PRAC
    "NOME DA HABILIDADE" para que ele a ensine.
    Durante os primeiros níveis do jogo, você encontrará os mestres que o seu
    personagem precisará na área inicial mesmo. Porém, ao concluir a jornada
    pela Área Inicial e sair para o mundo, você precisará encontrar os
    diversos mestres que estão espalhados pela Terra Média.
    Caso você tenha escolhido uma classe mágica para o seu personagem
    (Clérigo, Druida ou Mago), você precisará que ele aprenda duas habilidades
    importantes para ele poder utilizar magias em combate, sendo elas: Estilo
    Evasivo e Míssil Mágico. Não deixe de consultar o PRACTICE INFO delas.
    Já se escolheu uma das classes físicas para o seu personagem (Guerreiro,
    Ladino ou Ranger), a habilidade recomendada para você começar a utilizar
    ataques durante os combates é Chutar. Confira o PRACTICE INFO CHUTAR para
    obter mais informações.
    Para interagir com o professor desta sala, chame ele digitando SAY
    PROFESSOR.
