                             AUTO-CONHECIMENTO
    Como em todo bom RPG, no MUD Valinor o seu personagem é composto por uma série
    de atributos que delimitam os seus pontos fracos e fortes. É importante que
    você seja capaz de ter acesso a estes dados para que no futuro você também seja
    capaz de melhorá-los à medida que torna-se mais experiente.
    Digitando SCORE, será exibida uma tabela detalhada com todas as características
    do seu personagem, tais como a sua raça, classe, força, pontos de vida e muitas
    outras informações possivelmente estranhas de início, mas que irá compreender à
    medida que for se habituando ao jogo.
    Digitando AFFECTED, serão listadas possíveis magias que estejam afetando o seu
    personagem. Ao usar o comando AFFECTED BY serão listados certos efeitos em seu
    personagem, tais como resistência, fraquezas e imunidades a determinados
    elementos.
