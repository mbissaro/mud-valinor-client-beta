  body: |-
    Ao observar este orbe, o seguinte conhecimento lhe é transmitido:
                                  COMUNICAÇÃO
    Saber se comunicar no MUD é fundamental, pois é a principal forma com que você
    interage com outros personagens, interpreta, e compartilha informações.
    É possível se comunicar de duas formas distintas, a saber, por meio de canais
    IC (In Character) e canais OOC (Out of Character). Canais IC são aqueles
    que você deve utilizar quando está interpretando o seu personagem, tal como se
    você estivesse na Terra-Média. Já os canais OOC são utilizados para uma
    comunicação mais geral, com assuntos que podem ir além do personagem e do mundo
    fantasioso a sua volta.
    Quando um jogador comenta com outra pessoa que esteja na mesma sala que ele
    as suas aventuras, a criatura que ele matou, tesouros que ele conquistou ou
    até mesmo uma informação de como chegar em uma cidade do jogo, este jogador
    deverá utilizar meios de comunicação (canais) IC.
    Já quando você quer comentar sobre alguma notícia que viu na internet, ou
    passar alguma informação que não tenha relação com o MUD, deverá utilizar
    os canais OOC.
    OBS: OOC é o mesmo que IRL, termo também usado em jogos com o mesmo
    significado.
    Tecle EXAMINE PLACA para continuar seu aprendizado.
    A professora Erisha faz algumas anotações.
  rooms:
  - room:academia.a-sala-da-comunicacao
  sources:
  - logs/transcript.log
  confidence: confirmed
- id: text:look.examine-placa-2
  kind: look
  title: examine placa
  body: |-
    As palavras contidas nesta placa lhe revelam o seguinte conhecimento:
                             Canais e Mensagens
    Há vários canais, mas o mais útil no momento é o canal SAY, que envia uma
    mensagem para todos que estejam na mesma sala que você; para utilizá-lo,
    digite SAY seguido da mensagem que quer falar, por exemplo, SAY Olá! (este
    é um canal IC). E você já deve ter o usado no seu caminho de conhecimentos
    até aqui.
    Para mandar uma mensagem para todos os jogadores do MUD, usa-se o canal
    CHAT, digitando, por exemplo, CHAT Olá!, e caso queira falar com uma pessoa
    em especial, que não esteja na mesma sala que você, use TELL seguido do nome
    da pessoa e da mensagem, por exemplo, TELL Fulano Olá. Os canais CHAT e
    TELL são OOC. Caso deseje saber quais personagens estão visíveis online, basta
    digitar WHO.
    Há ainda os chamados comandos sociais, que geralmente auxiliam na intepretação
    (experimente digitar SMILE) e para o mesmo fim, o comando EMOTE, que deve ser
    digitado seguido de uma mensagem que você queira expressar, por exemplo, EMOTE
    é iniciante. Ambos os comandos exibem mensagens para todos que estejam na mesma
    sala que você.
    Por último, caso tenha algum problema, poderá pedir informações diretamente
    aos administradores do MUD, para isso o comando é MTALK seguido da sua
    mensagem.
    Para ligar e desligar os canais OOC, você usa o comando CHANNELS, para
    saber mais sobre ele e mais sobre os canais, leia o #PHELP CANAIS.
    E para mais informações sobre comunicação em geral, leia o HELP
    COMUNICAÇÃO.
    Interaja com a professora usando um social que dará olá para ela digitando:
    HELLO PROFESSORA.
    A professora Erisha faz algumas anotações.
